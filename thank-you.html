<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SeniorDev: Thank you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#eaf1ff;--ink:#14235c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a14}}
:root[data-theme="dark"]{--bg:#070a14}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;display:grid;place-items:center;background:var(--bg);font-family:"Source Sans 3",system-ui,sans-serif;overflow:hidden}
.emb body{background:transparent}
.scene{width:min(92vw,calc(84vh*1.7778));aspect-ratio:16/9;perspective:1500px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tilt,.card{width:100%;height:100%;transform-style:preserve-3d}
.card{position:relative;transition:transform .95s cubic-bezier(.3,.85,.25,1);outline:none}
.card.flip{transform:rotateY(180deg)}
.card:focus-visible .front{box-shadow:0 0 0 4px #7aa8ff}
.face{position:absolute;inset:0;border-radius:3.2cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;container-type:inline-size;border:3px solid transparent;padding:6cqw 7cqw;display:flex;flex-direction:column;justify-content:center}
.front{background:linear-gradient(135deg,#fff 0%,#fff 28%,#f1f6ff 52%,#c9d9ff 78%,#2a3f8f 118%) padding-box,conic-gradient(from 210deg,#ff5ec8,#5ee7ff,#8dffb0,#ffe45e,#ff5ec8) border-box;color:#14235c;box-shadow:0 3cqw 7cqw #1b2f7a40}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#070e2e 0%,#0e1b52 40%,#1b2f7a 70%,#7d94d9 100%) padding-box,conic-gradient(from 30deg,#ff5ec8,#5ee7ff,#8dffb0,#ffe45e,#ff5ec8) border-box;color:#fff;box-shadow:0 3cqw 8cqw #050a2680}
.holo,.glare,.dots{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.holo{background:repeating-linear-gradient(115deg,#ff008000 0 1.4cqw,#ff008024 1.8cqw,#00dcff24 2.6cqw,#6effaa24 3.4cqw,#ffe10020 4.2cqw,#ff008000 4.8cqw),linear-gradient(115deg,transparent 15%,#ff50c880 30%,#50dcff80 42%,#82ffaa73 54%,#ffe65a66 64%,transparent 80%);background-size:auto,260% 260%;background-position:0 0,var(--px,50%) var(--py,50%)}
.front .holo{mix-blend-mode:multiply;opacity:.5}
.back .holo{mix-blend-mode:color-dodge;opacity:.65}
.glare{background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#ffffffcc,#ffffff00 46%);mix-blend-mode:soft-light}
.front .glare{background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#14235c2e,#14235c00 50%);mix-blend-mode:normal}
.dots{background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);background-size:9cqw 9cqw,13cqw 13cqw;background-position:0 0,4cqw 5cqw;opacity:.22;animation:tw 3.2s ease-in-out infinite alternate}
.front .dots{background-image:radial-gradient(#2a3f8f 1px,transparent 1.5px),radial-gradient(#2a3f8f 1px,transparent 1.5px);opacity:.14}
@keyframes tw{to{opacity:.04}}
.mark{width:7cqw;height:7cqw;margin-bottom:3cqw}
.eyebrow{font:500 2.1cqw "Space Grotesk",sans-serif;letter-spacing:.06em;opacity:.75;margin:0 0 1.6cqw}
h1{font:700 9.2cqw/1.02 "Space Grotesk",sans-serif;margin:0;letter-spacing:-.02em}
.front h1 span{background:linear-gradient(90deg,#14235c,#2f6df6 60%,#12a8c9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:2.9cqw;line-height:1.35;margin:2.2cqw 0 0;max-width:70cqw;opacity:.85}
.hint{position:absolute;right:5cqw;bottom:3.6cqw;font-size:1.9cqw;font-weight:600;opacity:.6}
@media (prefers-reduced-motion:reduce){.card{transition-duration:.01s}.dots{animation:none}}
</style>
</head>
<body>
<div class="scene" id="scene"><div class="tilt" id="tilt">
<div class="card" id="card" role="button" tabindex="0" aria-pressed="false" aria-label="Flip the card">
<section class="face front">
<svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z" stroke="#14235c" stroke-width="3" stroke-linejoin="round"/><path d="M16 24l6 6 11-12" stroke="#2f6df6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p class="eyebrow">SeniorDev · Questions</p>
<h1>We’re ready for<br><span>any question.</span></h1>
<p class="sub">Security, performance, the RAG Agent or the sandbox: ask away.</p>
<div class="dots"></div><div class="holo"></div><div class="glare"></div>
<span class="hint">Click to flip</span>
</section>
<section class="face back">
<svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 4l16 6v12c0 10-7 18-16 22C15 40 8 32 8 22V10z" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M16 24l6 6 11-12" stroke="#7fe3ff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
<p class="eyebrow">SeniorDev: AI Code Review with Automated Verification</p>
<h1>Thank you</h1>
<p class="sub">Team 22 · FCIS, Ain Shams University · Department of Computer Science</p>
<div class="dots"></div><div class="holo"></div><div class="glare"></div>
<span class="hint">Click to flip back</span>
</section>
</div></div></div>
<script>
if(self!==top)document.documentElement.classList.add('emb');
const card=document.getElementById('card'),scene=document.getElementById('scene'),tilt=document.getElementById('tilt');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let flipped=false,hover=false,t=0,tx=.5,ty=.5;
function flip(){flipped=!flipped;card.classList.toggle('flip',flipped);card.setAttribute('aria-pressed',flipped)}
card.addEventListener('click',flip);
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
scene.addEventListener('pointermove',e=>{const r=scene.getBoundingClientRect();tx=(e.clientX-r.left)/r.width;ty=(e.clientY-r.top)/r.height;hover=true});
scene.addEventListener('pointerleave',()=>{hover=false});
function frame(){
t+=.012;
const x=hover?tx:.5+.35*Math.sin(t),y=hover?ty:.5+.3*Math.cos(t*.8);
const s=scene.style;
s.setProperty('--px',(x*100)+'%');s.setProperty('--py',(y*100)+'%');
s.setProperty('--gx',(x*100)+'%');s.setProperty('--gy',(y*100)+'%');
if(!calm){const k=hover?1:.45;tilt.style.transform='rotateX('+(-(y-.5)*10*k)+'deg) rotateY('+((x-.5)*14*k)+'deg)'}
requestAnimationFrame(frame)}
frame();
</script>
</body>
</html>
